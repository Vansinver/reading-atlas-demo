<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#080b10">
  <title>阅读装置｜选一本书</title>
  <style>
    :root {
      color-scheme: dark;
      --ink: #e9e4d8;
      --muted: #c5beaf;
      --amber: #f2b45c;
      --cyan: #8fd3e8;
    }
    * { box-sizing: border-box; }
    html { min-height: 100%; background: #080b10; }
    body {
      min-height: 100vh;
      min-height: 100dvh;
      margin: 0;
      overflow-x: hidden;
      color: var(--ink);
      background:
        radial-gradient(ellipse at 50% 88%, rgba(242, 180, 92, .12), transparent 43%),
        linear-gradient(180deg, #05070b 0%, #111725 72%, #161821 100%);
      font-family: "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", "Microsoft YaHei", system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: .35;
      background: linear-gradient(155deg, transparent 73%, rgba(242, 180, 92, .08) 84%, transparent 95%);
    }
    a { color: inherit; text-decoration: none; }
    .shell { position: relative; width: min(1080px, 100%); margin: 0 auto; padding: 24px 32px 56px; }
    .top { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
    .brand { color: var(--muted); font-size: 13px; letter-spacing: .36em; white-space: nowrap; }
    .brand::before {
      content: "";
      display: inline-block;
      width: 8px;
      height: 8px;
      margin-right: 12px;
      border-radius: 50%;
      vertical-align: middle;
      background: var(--amber);
      box-shadow: 0 0 14px var(--amber);
    }
    .top-note { color: #aaa394; font-size: 12px; letter-spacing: .1em; }
    .hero { max-width: 790px; margin: clamp(40px, 8vh, 84px) 0 42px; }
    .eyebrow { margin: 0 0 14px; color: var(--amber); font-size: 13px; letter-spacing: .12em; }
    h1 { margin: 0; font-size: clamp(34px, 5vw, 56px); line-height: 1.2; letter-spacing: .02em; }
    .hero p:last-child { max-width: 720px; margin: 16px 0 0; color: var(--muted); font-size: clamp(15px, 1.7vw, 18px); line-height: 1.75; }
    .section-title { display: flex; align-items: baseline; gap: 12px; margin: 0 0 18px; }
    .section-title h2 { margin: 0; font-size: 22px; }
    .section-title span { color: #aaa394; font-size: 13px; }
    .shelf { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; }
    .book-card {
      min-width: 0;
      min-height: 290px;
      display: grid;
      grid-template-columns: 114px minmax(0, 1fr);
      gap: 22px;
      padding: 24px;
      border: 1px solid rgba(255, 255, 255, .12);
      border-radius: 24px;
      background: rgba(14, 18, 25, .84);
      box-shadow: 0 22px 50px rgba(0, 0, 0, .25);
    }
    .book-card.available { border-color: rgba(242, 180, 92, .38); }
    .cover {
      align-self: start;
      width: 100%;
      aspect-ratio: 400 / 618;
      border-radius: 3px 7px 7px 3px;
      overflow: hidden;
      box-shadow: 0 16px 28px rgba(0, 0, 0, .5), 0 0 0 1px rgba(242, 180, 92, .22);
    }
    .cover img { display: block; width: 100%; height: 100%; object-fit: cover; }
    .cover.pending {
      display: grid;
      place-items: center;
      padding: 16px;
      border: 1px dashed rgba(242, 180, 92, .55);
      color: var(--amber);
      background: linear-gradient(145deg, #222028, #10141b);
      font-size: 20px;
      font-weight: 700;
      line-height: 1.4;
      text-align: center;
    }
    .card-content { display: flex; flex-direction: column; align-items: flex-start; min-width: 0; }
    .status {
      display: inline-block;
      padding: 5px 9px;
      border-radius: 5px;
      color: #16120e;
      background: var(--amber);
      font-size: 12px;
      font-weight: 700;
    }
    .status.pending { color: var(--muted); background: #26303b; }
    .card-content h3 { margin: 16px 0 8px; font-size: clamp(23px, 2.5vw, 29px); line-height: 1.3; }
    .card-content p { margin: 0; color: var(--muted); font-size: 14px; line-height: 1.65; }
    .enter {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 46px;
      margin-top: auto;
      padding: 9px 18px;
      border-radius: 999px;
      color: #17120d;
      background: var(--amber);
      font-size: 15px;
      font-weight: 700;
    }
    .enter:hover, .enter:focus-visible { background: #ffd08a; }
    .enter:focus-visible { outline: 3px solid var(--cyan); outline-offset: 3px; }
    .closing { margin: 26px 0 0; color: #aaa394; font-size: 12px; line-height: 1.7; }
    @media (max-width: 760px) {
      .shell { padding: max(18px, env(safe-area-inset-top)) 20px max(32px, env(safe-area-inset-bottom)); }
      .top-note { font-size: 11px; }
      .hero { margin: 34px 0 25px; }
      .eyebrow { margin-bottom: 8px; }
      h1 { font-size: clamp(28px, 8vw, 38px); }
      .hero p:last-child { margin-top: 10px; font-size: 14px; line-height: 1.6; }
      .section-title { margin-bottom: 12px; }
      .section-title h2 { font-size: 18px; }
      .shelf { grid-template-columns: minmax(0, 1fr); gap: 12px; }
      .book-card { min-height: 0; grid-template-columns: 80px minmax(0, 1fr); gap: 16px; padding: 16px; border-radius: 18px; }
      .card-content h3 { margin: 8px 0 4px; font-size: 21px; }
      .card-content p { font-size: 13px; line-height: 1.5; }
      .enter { min-height: 44px; margin-top: 12px; padding: 8px 14px; font-size: 14px; }
      .cover.pending { font-size: 16px; }
    }
    @media (max-width: 380px) {
      .shell { padding-left: 14px; padding-right: 14px; }
      .top-note { letter-spacing: 0; }
      .book-card { grid-template-columns: 68px minmax(0, 1fr); gap: 12px; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <header class="top">
      <span class="brand">阅读装置</span>
      <span class="top-note">从一本书，进入一个现场</span>
    </header>

    <main>
      <section class="hero" aria-labelledby="page-title">
        <p class="eyebrow">阅读装置 · 书架</p>
        <h1 id="page-title">从一本书，进入一个现场</h1>
        <p>这里收着读过的书，也收着从书里长出的互动现场。先选一本书，再选一个场景，动手试试看。</p>
      </section>

      <section aria-labelledby="shelf-title">
        <div class="section-title">
          <h2 id="shelf-title">选一本书</h2>
          <span>01 可体验 · 01 整理中</span>
        </div>
        <div class="shelf">
          <article class="book-card available">
            <div class="cover"><img src="assets/psychology-of-money-english-cover.jpg" alt="《金钱心理学》英文版封面"></div>
            <div class="card-content">
              <span class="status">已可体验 · 四个互动现场</span>
              <h3>《金钱心理学》</h3>
              <p>选一个场景，动手试一次。建议从《后视镜》开始。</p>
              <a class="enter" href="books/psychology-of-money.html">进入《金钱心理学》 →</a>
            </div>
          </article>

          <article class="book-card">
            <div class="cover pending" aria-hidden="true">小狗<br>钱钱</div>
            <div class="card-content">
              <span class="status pending">整理中 · 尚未上线</span>
              <h3>《小狗钱钱》</h3>
              <p>这本书的页面仍在核对，暂时没有可进入的作品。</p>
            </div>
          </article>
        </div>
      </section>
      <p class="closing">书中的想法和页面里的互动情境会分别标明。你可以从已开放的书开始探索。</p>
    </main>
  </div>
</body>
</html>
